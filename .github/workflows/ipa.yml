name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        # raw branch uses iOS 26 SDK APIs (UIGlassEffect); 26.3 is installed
        # on the macos-15 image (default is 16.4).
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Apply patches
        run: ./scripts/apply-patches.sh

      - name: Cache xcfs dependencies
        uses: actions/cache@v4
        with:
          path: blink/xcfs/.build
          key: xcfs-${{ runner.os }}-${{ hashFiles('blink/xcfs/Package.swift', 'blink/get_frameworks.sh') }}
          restore-keys: |
            xcfs-${{ runner.os }}-

      - name: Fetch frameworks and resources
        # Upstream scripts use paths relative to the blink repo root.
        working-directory: blink
        run: |
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Developer setup
        run: cp developer_setup.xcconfig blink/developer_setup.xcconfig

      - name: Build unsigned IPA
        run: ./scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-ipa
          path: build/Blink-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
